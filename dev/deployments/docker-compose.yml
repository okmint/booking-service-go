version: "3"

services:
  catalog-host:
    container_name: catalog-host
    image: ghcr.io/nazarovsa-mentorship/pet-booking-service-catalog/catalog-host:2.1.2
    platform: linux/amd64
    ports:
      - "8000:8080"
    volumes:
      - ./docker-compose-mount/BookingService.Catalog.Host/appsettings.json:/app/appsettings.json
      - ./docker-compose-mount/BookingService.Catalog.Host/appsettings.Production.json:/app/appsettings.Production.json
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      catalog-db:
        condition: service_healthy
      catalog-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  catalog-migrations:
    container_name: catalog-migrations
    image: ghcr.io/nazarovsa-mentorship/pet-booking-service-catalog/catalog-migrations:2.1.2
    platform: linux/amd64
    environment:
      DOTNET_ENVIRONMENT: Production
    depends_on:
      catalog-db:
        condition: service_healthy
  
  catalog-db:
    image: postgres:latest
    container_name: catalog-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: "booking_service_catalog"
      POSTGRES_USER: "catalog_admin"
      POSTGRES_PASSWORD: "admin_catalog"
      PGDATA: /data/postgres
    healthcheck:
      test: /usr/bin/pg_isready
      interval: 5s
      timeout: 10s
      retries: 5
        
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 10s
      retries: 3

  notification-mock:
    image: wiremock/wiremock:latest
    container_name: notification-service-mock
    ports:
      - "9000:8080"
    volumes:
      - ./notification-mock/mappings:/home/wiremock/mappings
    command:
      - --global-response-templating
      - --verbose

  booking-host:
    build:
      context: ../..
      dockerfile: dev/deployments/Dockerfile
    ports:
      - "8081:8080"
    env_file:
      - compose.dev.env
    depends_on:
      booking-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      notification-mock:
        condition: service_started

  booking-db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes:
      - booking-db-data:/var/lib/postgresql/data

volumes:
  booking-db-data:
